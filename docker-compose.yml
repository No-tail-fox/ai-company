name: ai-company

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: Light AI SaaS
      DATABASE_URL: sqlite:////data/app.db
      STORAGE_DIR: /storage
      JWT_SECRET: ${JWT_SECRET:-change-me-before-production}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      - redis
    expose:
      - "8000"
    volumes:
      - backend_data:/data
      - backend_storage:/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=info", "--pool=solo", "--concurrency=1"]
    environment:
      APP_NAME: Light AI SaaS
      DATABASE_URL: sqlite:////data/app.db
      STORAGE_DIR: /storage
      JWT_SECRET: ${JWT_SECRET:-change-me-before-production}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      - redis
      - backend
    volumes:
      - backend_data:/data
      - backend_storage:/storage
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    restart: unless-stopped

volumes:
  backend_data:
    name: ai-company-backend-data
  backend_storage:
    name: ai-company-backend-storage
  redis_data:
    name: ai-company-redis-data
